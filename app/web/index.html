<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese study</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script>
    try {
      if (localStorage.getItem("japanese-study-theme") === "easy") {
        document.documentElement.classList.add("theme-easy");
      }
    } catch (err) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <div id="gate">
    <div class="gate-wrap">
    <div class="theme-switch" role="group" aria-label="Display">
      <button type="button" data-theme="modern" aria-pressed="true">Modern</button>
      <button type="button" data-theme="easy" aria-pressed="false">Easy on eyes</button>
    </div>
    <section class="login-card">
      <img src="login-art.jpg" alt="A notebook open to the character あ, a red book, tea, and plum blossoms">
      <div class="login-body">
        <h2 id="gateTitle">Sign in</h2>
        <p id="gateNote" class="meta">Enter your identifier and password. A new identifier starts registration.</p>
        <form id="loginForm">
          <label>Identifier <input id="loginId" autocomplete="username" required></label>
          <label>Password <input id="loginPassword" type="password" autocomplete="current-password" required></label>
          <p id="loginError" class="form-error"></p>
          <button class="primary" type="submit">Continue</button>
        </form>
        <form id="registerForm" hidden>
          <label>Name <input id="regName" autocomplete="name" required></label>
          <label>Identifier <input id="regId" autocomplete="username" required></label>
          <label>Gender
            <select id="regGender" required>
              <option value="">Choose</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label>Date of birth <input id="regBirth" type="date" required></label>
          <label>Password <input id="regPassword" type="password" autocomplete="new-password" required></label>
          <p id="regError" class="form-error"></p>
          <div class="row">
            <button class="primary" type="submit">Create account</button>
            <button id="regBack" type="button">Back</button>
          </div>
        </form>
      </div>
    </section>
    </div>
  </div>
  <div id="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="logo.svg" alt="">
        <div class="brand-copy">
          <h1>Japanese study</h1>
          <p class="eyebrow">Client work</p>
        </div>
      </div>
      <nav id="modes" aria-label="Study modes"></nav>
      <div class="header-actions">
        <div class="header-row">
          <div class="theme-switch" role="group" aria-label="Display">
            <button type="button" data-theme="modern" aria-pressed="true">Modern</button>
            <button type="button" data-theme="easy" aria-pressed="false">Easy on eyes</button>
          </div>
          <button id="todayBtn" type="button">Today's lesson</button>
          <p id="who" class="who" hidden></p>
          <button id="signOut" type="button" hidden>Sign out</button>
        </div>
      </div>
    </header>
    <div class="shell">
      <aside>
        <div class="aside-head">
          <p class="aside-label">Lessons</p>
          <label class="find">Find
            <input id="findDay" type="search" placeholder="Day, word, or title">
          </label>
        </div>
        <ol id="dayList"></ol>
        <div class="aside-tools">
          <label>Course start <input id="startDate" type="date"></label>
          <label class="check"><input id="hidePronunciation" type="checkbox"> Hide pronunciation</label>
          <label class="check"><input id="hideRomaji" type="checkbox"> Hide romaji</label>
        </div>
        <footer class="foot">
          <div class="foot-progress">
            <span class="foot-mark" aria-hidden="true">あ</span>
            <p id="footProgress">Japanese study</p>
          </div>
          <div class="foot-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Lessons studied">
            <span id="footBar"></span>
          </div>
          <p id="footNext">Sign in to open today's lesson.</p>
        </footer>
      </aside>
      <div class="stage">
        <p id="voiceNote" class="voice idle" aria-live="polite">Not playing.</p>
        <div id="eyeBlink" class="eye-blink" hidden></div>
        <div class="stage-body">
          <main>
            <div id="view"></div>
          </main>
          <aside id="eyeRail" class="eye-rail" lang="en" aria-label="Eye protection"></aside>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="eye.js"></script>
</body>
</html>
